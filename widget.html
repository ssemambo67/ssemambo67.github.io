<html>
<head>
  <title>My web page</title>
  <style>

#container {
width: 100%;
}

.box {
float: left;
width: 30%;
padding: 10px;
min-height: 600px;
}

#box1 {
background-color: #ff9999;
}

#box2 {
background-color: #99ccff;
}

#box3 {
background-color: #99ff99;
}

h2 {
text-align: center;
}

.game-wrapper {
width: 100%;
height: 400px;
overflow: hidden;
position: relative;
}

.game-wrapper iframe {
position: absolute;
top: 0;
left: 0;
width: 800px;
height: 600px;
transform: scale(0.6);
transform-origin: top left;
border: none;
}

.back-btn {
display: block;
width: fit-content;
margin: 10px auto;
padding: 12px 18px;
background-color: black;
color: white;
text-decoration: none;
border-radius: 8px;
font-size: 18px;
}

.back-btn:hover {
background-color: #444;
}

.section-title {
text-align: center;
font-weight: bold;
margin-top: 10px;
}

  </style>
</head>

<body>

<a href="index.html" class="back-btn">Back to Home</a>

<h2 style="text-align:center;">My Widget Page</h2>

<div id="container">

<!-- WEATHER -->

<div class="box" id="box1">
  <h2>Weather</h2>

<a class="weatherwidget-io"
  href="https://forecast7.com/en/43d65n79d38/toronto/"
  data-label_1="TORONTO"
  data-label_2="WEATHER"
  data-theme="original">
TORONTO WEATHER </a>

  <script>
    !function(d,s,id){
      var js,fjs=d.getElementsByTagName(s)[0];
      if(!d.getElementById(id)){
        js=d.createElement(s);
        js.id=id;
        js.src='https://weatherwidget.io/js/widget.min.js';
        fjs.parentNode.insertBefore(js,fjs);
      }
    }(document,'script','weatherwidget-io-js');
  </script>

</div>

<!-- CALENDAR + QUOTE -->

<div class="box" id="box2">
  <h2>Calendar</h2>

  <iframe
    src="https://calendar.google.com/calendar/embed?src=en.canadian%23holiday%40group.v.calendar.google.com&ctz=America%2FToronto"
    width="100%"
    height="400">
  </iframe>

  <div class="section-title">Quote of the Day</div>
  <p id="quote" style="text-align:center; padding:10px; font-style:italic;"></p>

</div>

<!-- TOOLS -->

<div class="box" id="box3">
  <h2>Tools</h2>

  <iframe
    src="https://openspeedtest.com/Get-widget.php"
    width="100%"
    height="200">
  </iframe>

<br><br>

  <iframe
    src="https://www.google.com/maps?q=Toronto&output=embed"
    width="100%"
    height="200">
  </iframe>

  <br>

  <div class="section-title">Featured Video</div>

  <iframe width="100%" height="200"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    allowfullscreen>
  </iframe>

  <h3 style="text-align:center;">Pac-Man Game</h3>

  <div class="game-wrapper">
    <iframe 
      src="https://freepacman.org/" 
      allowfullscreen>
    </iframe>
  </div>

</div>

</div>

<!-- QUOTE SCRIPT -->

<script>
const quotes = [
  "Stay hungry, stay foolish.",
  "Code is like humor. When you have to explain it, it’s bad.",
  "Small steps every day.",
  "Dream big. Start small. Act now.",
  "Consistency beats motivation."
];

document.getElementById("quote").innerText =
  quotes[Math.floor(Math.random() * quotes.length)];
</script>

</body>
</html>
